<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="住宅の地震・停電対策25問セルフ診断">
<title>住宅の地震・停電対策 25問セルフ診断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;line-height:1.7}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 14px rgba(0,0,0,.08)}h1{font-size:25px;line-height:1.4}h2{font-size:21px}.lead{color:#555}.badge{display:inline-block;background:#e8f1ff;border-radius:999px;padding:4px 10px;font-size:13px}.option{display:block;border:1px solid #d5d9de;border-radius:12px;padding:13px;margin:10px 0;background:#fff}.option input{margin-right:9px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:bold;background:#2463c5;color:white}button:disabled{background:#b8bec5}.secondary{background:#68727d}.hidden{display:none}.progress{height:10px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;width:0;background:#3973d6}.q{font-size:19px;font-weight:bold}.small{font-size:13px;color:#666}.score{text-align:center;font-size:46px;font-weight:800}.level{text-align:center;font-size:20px;font-weight:bold}.box{background:#f6f8fa;border-radius:12px;padding:14px}.priority{border-left:5px solid #2463c5;background:#f7f9fb;padding:10px 13px;margin:8px 0}details{border-top:1px solid #eee;padding:10px 0}summary{font-weight:bold;cursor:pointer}.warning{background:#fff6e5;border-left:5px solid #e0a100;padding:12px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">

<section id="start" class="card">
<span class="badge">無料・スマホ対応</span>
<h1>住宅の地震・停電対策<br>25問セルフ診断</h1>
<p class="lead">25問に答えるだけで、地震・家具・避難・停電・電気設備などの備えを100点満点でチェックします。</p>
<h3>住まいの種類を選択</h3>
<label class="option"><input type="radio" name="house" value="rental">賃貸住宅</label>
<label class="option"><input type="radio" name="house" value="owned">持ち家（一戸建て）</label>
<label class="option"><input type="radio" name="house" value="condo">分譲マンション</label>
<button id="startBtn" disabled>診断をスタート</button>
<p class="small">※一般的なセルフチェックです。建物や設備の安全性を保証するものではありません。</p>
</section>

<section id="quiz" class="card hidden">
<div id="qnum"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question" class="q"></div>
<div id="options"></div>
<button id="nextBtn" disabled>次の質問へ</button>
</section>

<section id="result" class="card hidden">
<span class="badge">診断結果</span>
<h2>あなたの住宅防災チェック結果</h2>
<div class="score"><span id="score">0</span><span style="font-size:20px"> / 100点</span></div>
<div id="level" class="level"></div>
<div id="summary" class="box"></div>
<h3>優先して確認したい項目</h3>
<div id="priorities"></div>
<h3>25問のチェック結果</h3>
<div id="detail"></div>
<div class="warning"><b>安全に関する注意</b><br>大きな家具・家電、分電盤、配線、住宅設備などに不安がある場合は、無理に作業せず、管理会社・施工業者・電気工事士など専門家へ相談してください。</div>
<br><button class="secondary" onclick="location.reload()">もう一度診断する</button>
</section>
</div>

<script>
const common=[
["家具・室内","背の高い家具は、地震で倒れないよう固定していますか？","固定している","固定していない・不十分"],
["家具・室内","家具の上に、落下すると危険な物を置いていませんか？","置いていない","置いている"],
["家具・室内","寝室の近くに、倒れたり落下したりする家具がありますか？","ない","ある"],
["家具・室内","食器棚や本棚の扉に、飛び出し防止対策をしていますか？","している","していない"],
["ガラス・通路","窓やガラス家具に、飛散防止対策をしていますか？","している","していない"],
["避難","玄関・廊下・階段などの避難経路に物を置いていませんか？","置いていない","置いている"],
["避難","家族で地震発生時の避難場所・集合方法を決めていますか？","決めている","決めていない"],
["備蓄","飲料水・食料を数日分以上備蓄していますか？","備蓄している","不足している"],
["備蓄","懐中電灯・モバイルバッテリーなどをすぐ使える場所に置いていますか？","置いている","置いていない"],
["停電","停電したときにスマートフォンを充電する方法を用意していますか？","用意している","用意していない"],
["電気設備","分電盤（ブレーカー）の場所と操作方法を把握していますか？","把握している","把握していない"],
["電気設備","停電復旧後に、電気製品を安全確認してから使用する意識がありますか？","ある","あまりない"],
["防災情報","自治体のハザードマップで自宅周辺の災害リスクを確認していますか？","確認している","確認していない"],
["防災情報","家族の連絡方法や災害用伝言サービスの使い方を確認していますか？","確認している","確認していない"],
["初動対応","地震直後の火気・電気・落下物などの確認行動を家族で共有していますか？","共有している","共有していない"]
];

const rental=[
["賃貸","家具固定について、壁や床を傷つけない方法を検討していますか？","検討している","していない"],
["賃貸","家具固定や設備変更について、管理会社・大家への確認が必要な点を把握していますか？","把握している","把握していない"],
["賃貸","退去時の原状回復が必要になる可能性を考えて対策していますか？","考えている","考えていない"],
["賃貸","賃貸住宅の避難経路・共用部の防災ルールを確認していますか？","確認している","確認していない"],
["賃貸","ガス・水道・電気などの停止時の連絡先を把握していますか？","把握している","把握していない"],
["賃貸","室内の分電盤やブレーカーがどこにあるか確認していますか？","確認している","確認していない"],
["賃貸","停電時に共用設備やオートロック等がどうなるか確認していますか？","確認している","確認していない"],
["賃貸","家具固定器具が壁・柱・家具の構造に合っているか確認していますか？","確認している","確認していない"],
["賃貸","退去時に残せない可能性のある設備・配線工事を勝手に行わないよう注意していますか？","注意している","注意していない"],
["賃貸","管理会社・大家への緊急連絡方法をすぐ確認できますか？","できる","できない"]
];

const owned=[
["持ち家","住宅の耐震性や建築時期について確認していますか？","確認している","確認していない"],
["持ち家","屋根・外壁・基礎などに、ひび割れや劣化がないか確認していますか？","確認している","確認していない"],
["持ち家","家具固定のために、壁下地や柱など固定先を確認していますか？","確認している","確認していない"],
["持ち家","分電盤・ブレーカーの位置と回路を把握していますか？","把握している","把握していない"],
["持ち家","感震ブレーカーなど、地震時の電気火災対策を検討していますか？","検討している","検討していない"],
["持ち家","停電時の非常用電源や蓄電池などを検討していますか？","検討している","検討していない"],
["持ち家","太陽光発電設備がある場合、停電時の自立運転方法を確認していますか？","確認している・該当なし","確認していない"],
["持ち家","屋外の給湯器・室外機・物置などの転倒や落下対策をしていますか？","している","していない"],
["持ち家","断水時に備えて、トイレ・生活用水の対策をしていますか？","している","していない"],
["持ち家","地震後に住宅設備を確認する手順を家族で共有していますか？","共有している","共有していない"]
];

const condo=[
["分譲マンション","マンションの耐震性・築年・耐震改修等について確認していますか？","確認している","確認していない"],
["分譲マンション","管理規約や防災マニュアルを確認していますか？","確認している","確認していない"],
["分譲マンション","エレベーター停止時の避難・生活対策を考えていますか？","考えている","考えていない"],
["分譲マンション","停電時に断水する可能性や給水方式を確認していますか？","確認している","確認していない"],
["分譲マンション","共用部の非常用電源や防災設備について確認していますか？","確認している","確認していない"],
["分譲マンション","室内の分電盤・ブレーカーの位置と回路を把握していますか？","把握している","把握していない"],
["分譲マンション","ベランダの避難経路や隔て板付近に物を置いていませんか？","置いていない","置いている"],
["分譲マンション","家具の固定方法について、壁の構造などを確認していますか？","確認している","確認していない"],
["分譲マンション","マンション内の防災訓練や安否確認方法を把握していますか？","把握している","把握していない"],
["分譲マンション","管理組合・管理会社への災害時の連絡方法を確認していますか？","確認している","確認していない"]
];

let qs=[],i=0,ans=[],house="";
const $=id=>document.getElementById(id);

document.querySelectorAll('input[name="house"]').forEach(x=>x.onchange=()=>{$("startBtn").disabled=false});
$("startBtn").onclick=()=>{
 house=document.querySelector('input[name="house"]:checked').value;
 qs=common.concat(house==="rental"?rental:house==="owned"?owned:condo);
 i=0;ans=[];$("start").classList.add("hidden");$("quiz").classList.remove("hidden");show();scrollTo(0,0);
};

function show(){
 const q=qs[i];
 $("qnum").textContent=`質問 ${i+1} / ${qs.length}　【${q[0]}】`;
 $("bar").style.width=(i/qs.length*100)+"%";
 $("question").textContent=q[1];
 $("options").innerHTML=`<label class="option"><input type="radio" name="ans" value="yes"> ${q[2]}</label><label class="option"><input type="radio" name="ans" value="no"> ${q[3]}</label>`;
 $("nextBtn").disabled=true;
 document.querySelectorAll('input[name="ans"]').forEach(x=>x.onchange=()=>{$("nextBtn").disabled=false});
 $("nextBtn").textContent=i===qs.length-1?"結果を見る":"次の質問へ";
}
$("nextBtn").onclick=()=>{
 const x=document.querySelector('input[name="ans"]:checked');if(!x)return;
 ans[i]=x.value;i++;
 if(i<qs.length){show();scrollTo(0,0)}else result();
};

function result(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 const score=Math.round(ans.filter(x=>x==="yes").length/25*100);
 $("score").textContent=score;
 let level,summary;
 if(score>=85){level="かなり良い備えです";summary="基本的な備えができています。未対応の項目を少しずつ埋めましょう。"}
 else if(score>=65){level="まずまずの備えです";summary="基本対策は進んでいます。未対応項目から優先して改善しましょう。"}
 else if(score>=45){level="改善したい項目があります";summary="地震・停電時に困る可能性がある項目が残っています。"}
 else{level="優先して備えを進めたい状態です";summary="家具転倒・避難・停電・電気設備などから順番に対策しましょう。"}
 $("level").textContent=level;$("summary").textContent=summary;

 const cats={};
 qs.forEach((q,n)=>{cats[q[0]]??={yes:0,total:0};cats[q[0]].total++;if(ans[n]==="yes")cats[q[0]].yes++});
 const list=Object.entries(cats).sort((a,b)=>a[1].yes/a[1].total-b[1].yes/b[1].total).slice(0,3);
 $("priorities").innerHTML=list.map(([c,v])=>`<div class="priority"><b>${c}</b><br>できている項目：${v.yes} / ${v.total}（${Math.round(v.yes/v.total*100)}%）</div>`).join("");
 $("detail").innerHTML=qs.map((q,n)=>`<details><summary>${ans[n]==="yes"?"○":"△"} Q${n+1}. ${q[1]}</summary><p>${ans[n]==="yes"?"現在の回答では対策できています。":"今後の対策候補です。住宅の状況に合う方法を検討してください。"}</p></details>`).join("");
 $("bar").style.width="100%";scrollTo(0,0);
}
</script>
</body>
</html>
