<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>わが家の防災リスク25問診断</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f5f7fa;
  color: #222;
  line-height: 1.7;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 20px 16px 50px;
}

header {
  text-align: center;
  padding: 25px 10px;
}

header h1 {
  font-size: 26px;
  margin: 0 0 10px;
}

header p {
  margin: 0;
  color: #666;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.progress-area {
  margin-bottom: 20px;
}

.progress-text {
  font-size: 14px;
  color: #666;
  margin-bottom: 7px;
}

.progress {
  width: 100%;
  height: 10px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #333;
  transition: width 0.3s;
}

.question-number {
  font-size: 14px;
  color: #777;
  margin-bottom: 5px;
}

.question {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

.choice {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 2px solid #ddd;
  background: #fff;
  border-radius: 10px;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

.choice:hover {
  background: #f3f4f6;
}

.choice.selected {
  border-color: #222;
  background: #f0f0f0;
}

button {
  font-family: inherit;
}

.main-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  margin-top: 20px;
  background: #222;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.main-button:disabled {
  background: #bbb;
  cursor: not-allowed;
}

.back-button {
  width: 100%;
  border: 1px solid #ccc;
  background: white;
  border-radius: 10px;
  padding: 13px;
  margin-top: 10px;
  font-size: 15px;
  cursor: pointer;
}

.hidden {
  display: none;
}

.result-title {
  text-align: center;
  font-size: 25px;
  margin-bottom: 10px;
}

.result-summary {
  text-align: center;
  color: #555;
  margin-bottom: 25px;
}

.category {
  margin: 18px 0;
  padding: 17px;
  border-radius: 12px;
  background: #f7f7f7;
}

.category h3 {
  margin: 0 0 7px;
}

.score {
  font-size: 14px;
  color: #666;
}

.risk-high {
  border-left: 6px solid #d32f2f;
}

.risk-middle {
  border-left: 6px solid #f57c00;
}

.risk-low {
  border-left: 6px solid #388e3c;
}

.priority {
  font-weight: bold;
  margin-bottom: 5px;
}

.action-list {
  padding-left: 20px;
  margin-bottom: 0;
}

.overall {
  text-align: center;
  padding: 20px;
  background: #f1f1f1;
  border-radius: 12px;
  margin-bottom: 20px;
}

.overall-number {
  font-size: 38px;
  font-weight: bold;
}

.small-note {
  font-size: 13px;
  color: #777;
}

.start-button {
  margin-top: 15px;
}

.restart {
  margin-top: 20px;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>わが家の防災リスク25問診断</h1>
  <p>地震・火災・停電・断水・避難の5分野をチェック</p>
</header>


<!-- スタート画面 -->
<div id="startScreen" class="card">

  <h2>あなたの家の防災リスクをチェック</h2>

  <p>
    25問の質問に答えるだけで、あなたの家で優先して対策したい
    防災リスクを5つのカテゴリーに分けて診断します。
  </p>

  <ul>
    <li>地震</li>
    <li>火災</li>
    <li>停電</li>
    <li>断水</li>
    <li>避難</li>
  </ul>

  <p class="small-note">
    ※この診断は防災意識を高めるための簡易チェックです。
    災害時の安全を保証するものではありません。
  </p>

  <button class="main-button start-button" onclick="startDiagnosis()">
    診断をスタート
  </button>

</div>


<!-- 質問画面 -->
<div id="questionScreen" class="card hidden">

  <div class="progress-area">
    <div id="progressText" class="progress-text">

    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </div>

  <div id="questionNumber" class="question-number"></div>

  <div id="questionText" class="question"></div>

  <div id="choices"></div>

  <button
    id="nextButton"
    class="main-button"
    onclick="nextQuestion()"
    disabled>
    次へ
  </button>

  <button
    id="backButton"
    class="back-button"
    onclick="previousQuestion()">
    前の質問へ
  </button>

</div>


<!-- 結果画面 -->
<div id="resultScreen" class="hidden">

  <div class="card">

    <h2 class="result-title">
      診断結果
    </h2>

    <p class="result-summary">
      あなたの家で優先して確認したいリスクを
      高い順に表示しています。
    </p>

    <div class="overall">
      <div>総合チェックポイント</div>
      <div id="overallScore" class="overall-number">0</div>
      <div> / 100</div>
    </div>

    <h2>リスクランキング</h2>

    <div id="resultCategories"></div>

    <button
      class="main-button restart"
      onclick="restartDiagnosis()">
      もう一度診断する
    </button>

  </div>

</div>


<div class="footer">
  わが家の防災リスク25問診断
</div>

</div>


<script>

    ]

];


/* =========================
   設定
========================= */

let currentQuestion = 0;

let answers = [];

const categories = [
  "地震",
  "火災",
  "停電",
  "断水",
  "避難"
];


/* =========================
   診断スタート
========================= */

function startDiagnosis() {

  currentQuestion = 0;

  answers = [];

  document.getElementById("startScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.add("hidden");

  document.getElementById("questionScreen")
    .classList.remove("hidden");

  showQuestion();
}


/* =========================
   質問表示
========================= */

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    "Q" + (currentQuestion + 1);

  document.getElementById("questionText").textContent =
    q.text;

  document.getElementById("progressText").textContent =
    (currentQuestion + 1) + " / " + questions.length;

  const progress =
    ((currentQuestion + 1) / questions.length) * 100;

  document.getElementById("progressBar").style.width =
    progress + "%";

  const choicesDiv =
    document.getElementById("choices");

  choicesDiv.innerHTML = "";

  q.choices.forEach((choice, index) => {

    const button = document.createElement("button");

    button.className = "choice";

    button.textContent = choice.text;

    button.onclick = function() {
      selectChoice(index);
    };

    choicesDiv.appendChild(button);

  });

  document.getElementById("nextButton").disabled =
    answers[currentQuestion] === undefined;
}


/* =========================
   回答選択
========================= */

function selectChoice(index) {

  answers[currentQuestion] = index;

  const buttons =
    document.querySelectorAll(".choice");

  buttons.forEach(function(button, i) {

    if (i === index) {
      button.classList.add("selected");
    } else {
      button.classList.remove("selected");
    }

  });

  document.getElementById("nextButton").disabled = false;
}


/* =========================
   次の質問
========================= */

function nextQuestion() {

  if (answers[currentQuestion] === undefined) {
    return;
  }

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    showQuestion();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } else {

    showResults();

  }
}


/* =========================
   前の質問
========================= */

function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    showQuestion();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }
}


/* =========================
   結果計算
========================= */

function calculateResults() {

  const scores = {};

  categories.forEach(function(category) {
    scores[category] = 0;
  });

  questions.forEach(function(question, index) {

    const answerIndex = answers[index];

    if (answerIndex === undefined) {
      return;
    }

    const score =
      question.choices[answerIndex].score;

    scores[question.category] += score;

  });

  return scores;
}


/* =========================
   結果表示
========================= */

function showResults() {

  const scores = calculateResults();

  const sorted =
    categories
      .map(function(category) {
        return {
          category: category,
          score: scores[category]
        };
      })
      .sort(function(a, b) {
        return b.score - a.score;
      });


  document.getElementById("questionScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.remove("hidden");


  /* 総合スコア */

  const total =
    sorted.reduce(function(sum, item) {
      return sum + item.score;
    }, 0);

  const maxScore = 100;

  const overall =
    Math.round((total / maxScore) * 100);

  document.getElementById("overallScore").textContent =
    overall;


  /* カテゴリー結果 */

  const resultDiv =
    document.getElementById("resultCategories");

  resultDiv.innerHTML = "";


  sorted.forEach(function(item, index) {

    const category = item.category;

    const score = item.score;

    let level = "";

    let className = "";

    let action = [];

    if (score >= 15) {

      level = "優先して対策したい";

      className = "risk-high";

      action = getActions(category, "high");

    } else if (score >= 7) {

      level = "対策を見直したい";

      className = "risk-middle";

      action = getActions(category, "middle");

    } else {

      level = "現在の対策を維持";

      className = "risk-low";

      action = getActions(category, "low");

    }


    const div =
      document.createElement("div");

    div.className =
      "category " + className;


    let actionHtml = "";

    action.forEach(function(text) {

      actionHtml +=
        "<li>" + text + "</li>";

    });


    div.innerHTML = `

      <h3>
        ${index + 1}位　${category}
      </h3>

      <div class="score">
        チェックポイント：${score} / 20
      </div>

      <div class="priority">
        ${level}
      </div>

      <strong>まずやること</strong>

      <ul class="action-list">
        ${actionHtml}
      </ul>

    `;

    resultDiv.appendChild(div);

  });


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

      middle: [
        "避難所までのルートを地図で確認する",

}
